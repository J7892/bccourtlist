name: Daily Court List Scraper & Update Pipeline

on:
  schedule:
    # Runs weekday mornings at 14:37 UTC (7:37 AM PDT / 6:37 AM PST)
    # Using an off-peak minute (37) prevents GitHub scheduling queue delays
    - cron: '37 14 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Pipeline
        run: |
          python -m src.scraper

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ index.html
          if git diff --staged --quiet; then
            echo "No changes to commit. All files up to date."
          else
            git commit -m "Auto-update court lists and database [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
